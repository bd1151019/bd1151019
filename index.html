<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>李星妍 | 個人網頁</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
        /* 定義亮麗的漸層背景動畫 */
        .bg-animated-gradient {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            background-size: 200% 200%;
            animation: gradientMove 5s ease infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="bg-animated-gradient min-h-screen flex items-center justify-center p-6">

    <!-- 主卡片 (毛玻璃效果與大圓角) -->
    <main class="relative bg-white/80 backdrop-blur-xl rounded-[2.5rem] shadow-2xl shadow-pink-200/50 w-full max-w-sm p-8 pt-16 text-center mt-12 border border-white/50">
        
        <!-- 個人照片預留位置 (突出卡片上方) -->
        <div class="absolute -top-16 left-1/2 transform -translate-x-1/2 w-32 h-32 bg-white rounded-full p-1.5 shadow-xl shadow-pink-300/30">
            <!-- 將下方的 src 換成您自己的照片網址 -->
            <img src="https://placehold.co/400x400/ff7eb3/ffffff?text=Photo" alt="個人照片" class="w-full h-full object-cover rounded-full">
        </div>

        <!-- 基本資訊 -->
        <h1 class="text-3xl font-black text-slate-800 tracking-wide mb-1">李 星妍</h1>
        <p class="text-pink-500 font-bold text-sm mb-4">黎明技術學院數位多媒體系</p>
        
        <!-- 一句話介紹 -->
        <p class="text-slate-600 text-sm leading-relaxed mb-6 font-medium px-2">
            「喜歡簡單生活，也喜歡認真對待每一件事。」
        </p>

        <!-- 興趣與技能區塊精簡版 -->
        <div class="space-y-4 mb-6">
            <div>
                <span class="text-xs font-bold text-slate-400 uppercase tracking-widest block mb-2">My Skills</span>
                <div class="flex flex-wrap justify-center gap-2">
                    <span class="px-3 py-1 bg-gradient-to-r from-orange-400 to-rose-400 text-white rounded-full text-xs font-bold shadow-md">寫代碼</span>
                    <span class="px-3 py-1 bg-gradient-to-r from-orange-400 to-rose-400 text-white rounded-full text-xs font-bold shadow-md">微積分</span>
                </div>
            </div>
            <div>
                <span class="text-xs font-bold text-slate-400 uppercase tracking-widest block mb-2">My Hobbies</span>
                <div class="flex flex-wrap justify-center gap-2">
                    <span class="px-3 py-1 bg-gradient-to-r from-cyan-400 to-blue-400 text-white rounded-full text-xs font-bold shadow-md">讀書</span>
                    <span class="px-3 py-1 bg-gradient-to-r from-cyan-400 to-blue-400 text-white rounded-full text-xs font-bold shadow-md">睡覺</span>
                </div>
            </div>
        </div>

        <!-- 聯絡方式卡片區 -->
        <div class="bg-white/60 rounded-2xl p-4 text-left space-y-3 shadow-inner">
            <div class="flex items-center text-sm">
                <span class="w-8 text-pink-500 font-bold">✉️</span>
                <span class="text-slate-700 font-medium text-xs break-all">BD1151019@venus.lit.edu.tw.tw</span>
            </div>
            <div class="flex items-center text-sm">
                <span class="w-8 text-green-500 font-bold">💬</span>
                <span class="text-slate-700 font-medium text-sm">eyeechon</span>
            </div>
            <div class="flex items-center text-sm">
                <span class="w-8 text-purple-500 font-bold">📷</span>
                <span class="text-slate-700 font-medium text-sm">holamamiexx</span>
            </div>
        </div>

    </main>

</body>
</html>
